version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: task_manager_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: task_manager_api
    restart: always
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/task_manager
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
